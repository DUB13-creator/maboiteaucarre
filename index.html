<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma boîte au carré</title>
<meta name="claude:viewport-fit-sides" content="cover">



<style>
/* Direction : page claire et aérée, grand titre, un seul message par écran,
   cadre à filets fins, petites étiquettes en police technique, photos arrondies. */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --ink:#1C1D22; --muted:#6A6C75; --line:#DCDDE2;
  --green:#1F5C3F; --green-2:#2E7D55; --green-soft:#E4EEE8; --on-green:#FFFFFF; --chip:#FFFFFFD9;
  --f-sans:'Onest','Helvetica Neue',Arial,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111412; --surface:#1A1E1B; --ink:#EEF1EE; --muted:#9BA59F; --line:#2B322D;
  --green:#7BCB9F; --green-2:#2E7D55; --green-soft:#1D2A22; --on-green:#0C140F; --chip:#1A1E1BD9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111412; --surface:#1A1E1B; --ink:#EEF1EE; --muted:#9BA59F; --line:#2B322D;
  --green:#7BCB9F; --green-2:#2E7D55; --green-soft:#1D2A22; --on-green:#0C140F; --chip:#1A1E1BD9; color-scheme:dark}

*{box-sizing:border-box}

body{margin:0;background:linear-gradient(var(--surface) 0,var(--bg) 700px) var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p,ul,ol{margin:0}
h1,h2,h3{font-weight:400;letter-spacing:-.035em;line-height:1.04;text-wrap:balance}
h1{font-size:clamp(2.5rem,6.6vw,5.2rem);letter-spacing:-.045em}
h2{font-size:clamp(2rem,4.6vw,3.4rem)}
h3{font-size:1.3rem;font-weight:500;letter-spacing:-.02em;line-height:1.2}
a{color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:6px}
.mono,.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.eyebrow::before{content:"";display:inline-block;width:8px;height:8px;background:var(--green);margin-right:10px;border-radius:2px}
.lead{font-size:clamp(1.1rem,2vw,1.35rem);color:var(--muted);max-width:34em;line-height:1.5}

/* cadre à filets fins */
.frame{max-width:1240px;margin:0 auto;}
.sec{padding:clamp(56px,9vw,112px) clamp(20px,5vw,64px)}
.sec.tight{padding-block:clamp(36px,6vw,64px)}

/* logo */
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none}
.logo i{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:30px}
.logo i b{display:block;height:13px;background:var(--ink);border-radius:2px}
.logo i b:nth-child(2),.logo i b:nth-child(3){background:var(--green)}
.logo span{font-weight:700;font-size:.95rem;line-height:1.05;letter-spacing:-.01em}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:0;cursor:pointer;text-decoration:none;font:inherit;font-weight:600;
  font-size:1.05rem;min-height:58px;padding:0 30px;border-radius:999px;background:var(--ink);color:var(--bg);transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px)}
.btn.green{background:var(--green);color:var(--on-green)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sm{min-height:44px;padding:0 20px;font-size:.92rem}
.btn svg{width:20px;height:20px;flex:none}

/* en-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px clamp(4px,3vw,40px)}
.top nav{display:flex;gap:30px;font-size:.95rem;font-weight:500}
.top nav a{text-decoration:none;color:var(--muted)}.top nav a:hover{color:var(--ink)}

/* hero */
.hero{padding-bottom:clamp(28px,5vw,56px);text-align:center;display:grid;justify-items:center}
.hero .lead{margin-inline:auto}
.hero .eyebrow{display:block;margin-bottom:28px}
.hero .lead{margin-top:26px}
.hero .cta{margin-top:38px;justify-content:center;display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.hero .cta .mono{color:var(--muted)}
.shot{position:relative;border-radius:var(--r);overflow:hidden;background:var(--green-soft)}
.shot img{display:block;width:100%;height:100%;object-fit:cover}

.strip{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;max-width:980px;margin:0 auto;padding:0 clamp(20px,5vw,64px) clamp(56px,9vw,112px)}
.strip .shot{aspect-ratio:4/5;border-radius:26px}
.strip .shot img{object-position:50% 22%}
.statcard{border-radius:26px;background:var(--surface);box-shadow:0 1px 0 var(--line),0 20px 50px #0000000a;padding:clamp(24px,3vw,40px);display:grid;align-content:space-between;gap:24px}
.statcard dl{margin:0;display:grid;gap:0}
.statcard dl div{padding:18px 0;border-top:1px solid var(--line)}
.statcard dt{font-size:clamp(2.2rem,4vw,3.4rem);letter-spacing:-.04em;line-height:1;font-weight:400}
.statcard dd{margin:8px 0 0;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip{position:absolute;background:var(--chip);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:.95rem;box-shadow:0 8px 28px #0000001f}
.chip .ok{width:26px;height:26px;border-radius:8px;background:var(--green);color:var(--on-green);display:grid;place-items:center;flex:none}
.chip .ok svg{width:16px;height:16px}
.chip small{display:block;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);font-weight:500;letter-spacing:.04em}
.chip.a{left:16px;bottom:20px}
.chip.b{right:16px;top:20px}

/* titres de section */
.sh{display:grid;gap:18px;max-width:780px;margin:0 auto clamp(36px,6vw,64px);text-align:center;justify-items:center}
.steps .sh,.about .sh{margin-inline:0;text-align:left;justify-items:start}
.sh h2 em{font-style:normal;color:var(--green)}
.sh h2{font-size:clamp(1.9rem,4.2vw,3.1rem)}
.sh .sub{color:var(--muted);font-size:1.15rem;max-width:36em}

/* grilles à filets (reconnaissance / gestes) */
.cells{display:grid;gap:16px}
.cells.c2{grid-template-columns:1fr 1fr}
.cells.c4{grid-template-columns:repeat(4,1fr)}
.cell{padding:clamp(26px,3vw,38px);display:grid;gap:16px;align-content:start;background:var(--surface);border-radius:26px;box-shadow:0 1px 0 var(--line),0 20px 50px #0000000a}
.cell .n{font-family:var(--f-mono);font-size:.8rem;color:var(--green);font-weight:500}
.cell p{color:var(--muted);font-size:1rem}
.cell.big p{color:var(--ink);font-size:1.25rem;line-height:1.35;font-weight:400;letter-spacing:-.01em}
.cell svg.ic{width:40px;height:40px;color:var(--green)}
.after{margin-top:34px;justify-content:center;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center}
.also{margin-top:16px;display:flex;gap:16px;align-items:center;background:var(--green);color:var(--on-green);border-radius:var(--r);padding:22px 28px;font-weight:600}
.also svg{width:30px;height:30px;flex:none}

/* étapes */
.steps{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(32px,6vw,80px);align-items:start}
.steps .shot{aspect-ratio:1/1;position:sticky;top:96px;border-radius:26px}
.steps ol{list-style:none;padding:0;display:grid;counter-reset:s}
.steps li{display:grid;grid-template-columns:64px 1fr;gap:6px;padding:26px 0;border-top:1px solid var(--line);counter-increment:s}
.steps li:last-child{border-bottom:1px solid var(--line)}
.steps li::before{content:"0" counter(s);font-family:var(--f-mono);color:var(--green);font-weight:500;padding-top:4px;font-size:.9rem}
.steps li p{color:var(--muted);font-size:1.02rem;margin-top:6px}
.steps li b{font-weight:600;color:var(--green)}

/* formules */
.offers{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}
.offer{background:var(--surface);box-shadow:0 1px 0 var(--line),0 20px 50px #0000000a;border-radius:26px;padding:clamp(26px,3.4vw,42px);display:grid;gap:20px;align-content:start}
.offer.main{background:var(--green);color:var(--on-green);border-color:var(--green)}
.offer .tagl{justify-self:start;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:999px;background:var(--green-soft);color:var(--green);font-weight:500}
.offer.main .tagl{background:#ffffff26;color:var(--on-green)}
.offer h3{font-size:clamp(1.8rem,3vw,2.4rem);font-weight:400;letter-spacing:-.035em}
.offer p.d{opacity:.78}
.offer ul{list-style:none;padding:0;display:grid;gap:0}
.offer li{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.offer li svg{flex:none;width:20px;height:20px;margin-top:4px;color:var(--green)}
.offer.main li svg{color:var(--on-green)}
.offer .price{font-weight:600;font-size:1.15rem;padding-top:6px}

/* à propos */
.about{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(32px,6vw,80px);align-items:center}
.about .shot{aspect-ratio:4/5;border-radius:26px}
.about .shot img{object-position:50% 20%}
.about p{color:var(--muted);font-size:1.12rem}
.about p+p{margin-top:16px}
.specs{margin-top:32px;border-top:1px solid var(--line)}
.specs div{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid var(--line);font-weight:500}
.specs div span:first-child{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}

/* faq */
.faq{max-width:860px;margin:0 auto}
.faq details{border-top:1px solid var(--line);padding:24px 0}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:20px;font-size:1.3rem;font-weight:400;letter-spacing:-.015em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--f-mono);font-weight:400;color:var(--green);font-size:1.5rem;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{color:var(--muted);margin-top:12px;max-width:60ch}

/* appel final */
.final{border-radius:30px;background:var(--green);color:var(--on-green);padding:clamp(34px,6vw,72px);display:flex;flex-wrap:wrap;gap:28px 48px;align-items:center;justify-content:space-between}
.final .mono{color:inherit;opacity:.75}
.final h2{margin-top:14px;max-width:12em}
.final .btn{background:var(--on-green);color:var(--green)}
.final-wrap{padding:0 clamp(20px,5vw,64px) clamp(40px,6vw,80px)}
.final .btn{white-space:nowrap}
footer{max-width:1240px;margin:0 auto;border-top:1px solid var(--line);padding:28px clamp(20px,5vw,64px);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;font-size:.88rem;color:var(--muted)}

/* ===== questionnaire / résultat / merci ===== */
.view{max-width:1240px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(20px,5vw,64px) 96px;min-height:75vh}
.view .wrap{max-width:780px;margin:0 auto}
.prog{display:flex;gap:6px;margin-bottom:40px}
.prog i{flex:1;height:5px;background:var(--line);border-radius:5px}
.prog i.on{background:var(--green)}
.q-meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:18px}
.hand{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);letter-spacing:.04em}
.q-title{font-size:clamp(1.9rem,5vw,3rem);margin-bottom:34px;font-weight:400}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:18px;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:20px 22px;font:inherit;font-weight:500;font-size:1.05rem;cursor:pointer;min-height:66px;transition:border-color .12s,background .12s,transform .12s}
.opt:hover{border-color:var(--ink);transform:translateY(-1px)}
.opt .box{flex:none;width:24px;height:24px;border:1.5px solid var(--muted);border-radius:50%}
.opt[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.opt[aria-pressed="true"] .box{background:var(--on-green);border-color:var(--on-green)}
.back{margin-top:24px;background:none;border:0;color:var(--muted);font:inherit;font-weight:500;cursor:pointer;padding:10px 0}
.back:hover{color:var(--ink)}
.gauge{display:flex;gap:8px;margin:26px 0 14px}
.gauge i{width:56px;height:14px;border-radius:7px;background:var(--line)}
.gauge i.on{background:var(--green)}
.score{font-family:var(--f-mono);font-size:.85rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.res-card{background:var(--surface);box-shadow:0 1px 0 var(--line),0 20px 50px #0000000a;border-radius:26px;padding:clamp(24px,3.4vw,38px);margin-top:28px;display:grid;gap:16px}
.res-card ul{list-style:none;padding:0;display:grid;gap:12px}
.res-card li{display:flex;gap:12px}
.res-card li svg{flex:none;width:20px;height:20px;color:var(--green);margin-top:4px}
form{display:grid;gap:20px;margin-top:36px;background:var(--surface);box-shadow:0 1px 0 var(--line),0 20px 50px #0000000a;border-radius:26px;padding:clamp(24px,3.4vw,40px)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
label,.lbl{display:grid;gap:8px;font-weight:600;font-size:.95rem}
input[type=text],input[type=tel],input[type=email]{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 16px;min-height:56px;width:100%}
input[type=text]:focus,input[type=tel]:focus,input[type=email]:focus{outline:2px solid var(--green);border-color:var(--green)}
.slots{display:flex;flex-wrap:wrap;gap:10px}
.slots label{display:block;position:relative}
.slots input{position:absolute;opacity:0;pointer-events:none}
.slots span{display:block;border:1px solid var(--line);border-radius:999px;padding:13px 20px;cursor:pointer;font-weight:500;background:var(--bg)}
.slots input:checked+span{background:var(--green);border-color:var(--green);color:var(--on-green)}
.slots input:focus-visible+span{outline:3px solid var(--green);outline-offset:3px}
.consent{display:flex;gap:12px;align-items:flex-start;font-weight:400;font-size:.9rem;color:var(--muted)}
.consent input{width:22px;height:22px;margin-top:2px;accent-color:var(--green);flex:none}
.err{color:#B3261E;font-weight:600;font-size:.9rem;min-height:1.2em}
:root[data-theme="dark"] .err{color:#FF8A80}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#FF8A80}}
.demo{background:var(--green-soft);border-radius:14px;padding:16px 20px;font-size:.95rem;margin-top:20px}
.sub{color:var(--muted)}

@media (max-width:900px){
  .hero,.steps,.about,.offers{grid-template-columns:1fr}
  .steps .shot{position:static;order:-1;aspect-ratio:4/3}
  .cells.c4{grid-template-columns:1fr 1fr}
  .top nav{display:none}
}
@media (max-width:560px){
  body{font-size:17px}
  .cells.c2,.cells.c4,.row{grid-template-columns:1fr}
  .top .btn.sm{padding:0 14px;font-size:.82rem}
  .logo span{font-size:.85rem}
  .gauge i{width:44px}
  .strip{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* ===== finitions et mouvement (règles Emil Kowalski : courbes fortes, transform/opacity, pas de boucles décoratives) ===== */
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1)}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
.lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain}
.prog-scroll{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--green);z-index:40}
/* boutons : retour immédiat à la pression */
.btn{transition:transform 160ms var(--ease-out),background-color 200ms ease,color 200ms ease}
.btn:hover{transform:none}
.btn:active{transform:scale(0.97)}
.btn svg{transition:transform 200ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){
  .btn.green:hover{background:var(--green-2)}
  .btn:hover svg{transform:translateX(3px)}
  .cell,.statcard{transition:box-shadow 250ms ease}
  .cell:hover,.statcard:hover{box-shadow:0 1px 0 var(--line),0 24px 56px #00000012}
  .top nav a{transition:color 200ms ease}
}
.opt{transition:background-color 160ms ease,border-color 160ms ease,color 160ms ease,transform 160ms var(--ease-out)}
.opt:hover{transform:none}
.opt:active{transform:scale(0.98)}
/* étapes : l'étape en cours est mise en avant */
.steps li::before{transition:color 200ms ease}
.js-motion .steps li:not(.on)::before{color:var(--muted)}
/* cartes à halo (inspiré de React Bits « SpotlightCard ») */
.spot{position:relative;isolation:isolate;overflow:hidden}
.spot .sc-light,.spot .sc-edge{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0}
.spot .sc-light{z-index:-1}
.spot .sc-edge{z-index:1;padding:1px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}

/* ===== mouvement spectaculaire ===== */
.sp-w{display:inline-block;overflow:hidden;vertical-align:top;padding:.08em .04em .14em;margin:-.08em -.04em -.14em}
.sp-i{display:inline-block;will-change:transform}
.hero{position:relative}
.hero > div{position:relative;z-index:1}
.deco{position:absolute;z-index:0;pointer-events:none;border-radius:8px;display:block}
.d1{width:76px;height:76px;background:var(--green);left:3%;top:18%}
.d2{width:34px;height:34px;background:var(--ink);right:11%;top:16%}
.d3{width:120px;height:120px;background:var(--green-soft);right:6%;top:46%}
.d4{width:52px;height:52px;border:3px solid var(--green);left:4%;top:64%}
.d5{width:22px;height:22px;background:var(--green-2);left:27%;top:8%}
@media (max-width:720px){.d1{width:46px;height:46px;left:3%}.d3{width:70px;height:70px;right:2%;top:58%}.d4{left:6%}}
.band{overflow:hidden;padding:clamp(8px,2vw,20px) 0 clamp(24px,5vw,56px)}
.band-in{display:flex;white-space:nowrap;width:max-content;font-size:clamp(3.2rem,11vw,9.5rem);font-weight:600;letter-spacing:-.045em;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--ink);opacity:.9}
.band-in span{padding-right:.35em}
.shot img{will-change:transform}
.steps li{transition:opacity .45s var(--ease-out),transform .45s var(--ease-out)}
.js-motion .steps li:not(.on){opacity:.4}
.js-motion .steps li.on{transform:translateX(10px)}
.js-motion .steps li{will-change:opacity,transform}
.btn{will-change:transform}
#landing{overflow-x:clip}
@media (max-width:720px){.d1,.d4,.d5{display:none}.d2{right:5%;top:6%}.d3{right:-2%;top:auto;bottom:6%;width:64px;height:64px}}

/* ===== transition, curseur, défilement horizontal ===== */
.wipe{position:fixed;inset:0;z-index:200;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(5,1fr);pointer-events:none}
.wipe i{background:var(--green);transform:scale(0);transform-origin:center}
.ring{position:fixed;left:0;top:0;width:0;height:0;z-index:150;pointer-events:none;opacity:0}
.ring::before{content:"";position:absolute;left:-18px;top:-18px;width:36px;height:36px;border:1.5px solid var(--green);border-radius:6px;transition:transform .35s var(--ease-out),background-color .35s var(--ease-out)}
.ring.big::before{transform:scale(1.7) rotate(45deg);background:color-mix(in srgb,var(--green) 14%,transparent)}
@media (hover:none),(pointer:coarse){.ring{display:none}}
#methode{overflow:hidden}
#methode .cells.hs{display:flex;gap:18px;width:max-content;grid-template-columns:none}
#methode .cells.hs .cell{width:min(340px,26vw);flex:none}
.hero .lead{font-size:clamp(.98rem,1.6vw,1.12rem);max-width:38em}
.hero .lead{text-wrap:balance}

/* =====================================================================
   NEUMORPHISME + GLASSMORPHISME
   Neumorphisme : surfaces de la couleur du fond, relief par deux ombres (claire en haut à gauche, foncée en bas à droite),
   creux pour les champs et l'état « appuyé ». Glassmorphisme : verre dépoli (flou + liseré clair) sur les éléments flottants.
   ===================================================================== */
:root{
  --bg:#E4E9E6; --surface:#E4E9E6; --line:#C8D1CC; --muted:#56615B; --green-soft:#D3E2D9; --chip:#E4E9E6D9;
  --nm-hi:#FFFFFF; --nm-lo:#B4BFB9;
  --glass:#FFFFFF73; --glass-edge:#FFFFFFB3; --glass-shadow:#6F7D7640;
  --glass-green:linear-gradient(135deg,#1F5C3FEB 0%,#2E7D55D1 100%);
  --raise:10px 10px 22px var(--nm-lo),-10px -10px 22px var(--nm-hi);
  --raise-s:6px 6px 14px var(--nm-lo),-6px -6px 14px var(--nm-hi);
  --sink:inset 6px 6px 13px var(--nm-lo),inset -6px -6px 13px var(--nm-hi);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#1B201E; --surface:#1B201E; --line:#2C3330; --muted:#9BA59F; --green-soft:#24312A; --chip:#1B201ED9;

/* fond : même teinte partout + de grandes taches de couleur floues que le verre vient flouter */
body{background:
  radial-gradient(46vw 46vw at 8% 6%,#2E7D5538,transparent 70%),
  radial-gradient(40vw 40vw at 96% 30%,#7BCB9F40,transparent 70%),
  radial-gradient(44vw 44vw at 14% 62%,#1F5C3F26,transparent 70%),
  radial-gradient(40vw 40vw at 92% 92%,#7BCB9F33,transparent 70%),
  var(--bg);background-attachment:fixed}
body::before{background:transparent}

/* — verre — */
.top{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--glass-edge);box-shadow:0 8px 30px var(--glass-shadow)}
.statcard{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--glass-edge);box-shadow:0 18px 50px var(--glass-shadow),inset 0 1px 0 var(--glass-edge)}
.statcard dl div{border-top-color:var(--glass-edge)}
.offer.main,.final,.also{background:var(--glass-green);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #FFFFFF40;box-shadow:12px 12px 30px var(--glass-shadow),inset 0 1px 0 #FFFFFF59}
.offer.main .tagl{background:#FFFFFF2E}
.demo{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-edge)}

/* — neumorphisme : relief — */
.cell,.offer:not(.main),.res-card,form{background:var(--bg);border:0;box-shadow:var(--raise)}
.shot{background:var(--bg);box-shadow:var(--raise)}
.steps .shot{box-shadow:var(--raise)}
.deco{box-shadow:var(--raise-s)}
.d3{background:var(--bg)}
.d4{border:0;box-shadow:var(--sink)}
.d2{background:var(--ink)}
.opt{background:var(--bg);border:0;box-shadow:var(--raise-s)}
.opt:hover{border-color:transparent}
.opt:active,.opt[aria-pressed="true"]{box-shadow:var(--sink);background:var(--bg);color:var(--green)}
.opt .box{border:0;box-shadow:var(--sink);background:var(--bg)}
.opt[aria-pressed="true"] .box{background:var(--green);border:0;box-shadow:inset 3px 3px 7px #0000004d}
.slots span{background:var(--bg);border:0;box-shadow:var(--raise-s)}
.slots input:checked+span{background:var(--bg);color:var(--green);font-weight:600;box-shadow:var(--sink)}

/* — neumorphisme : creux — */
input[type=text],input[type=tel],input[type=email]{background:var(--bg);border:0;box-shadow:var(--sink)}
input[type=text]:focus,input[type=tel]:focus,input[type=email]:focus{outline:2px solid var(--green);border:0}
.prog i,.gauge i{background:var(--bg);box-shadow:var(--sink)}
.prog i.on,.gauge i.on{background:var(--green);box-shadow:0 0 12px color-mix(in srgb,var(--green) 55%,transparent)}

/* — boutons — */
.btn.green{background:linear-gradient(145deg,var(--green-2),var(--green));box-shadow:var(--raise-s)}
.btn.green:active{box-shadow:inset 4px 4px 10px #00000059,inset -3px -3px 8px #FFFFFF26}
.btn.line{background:var(--bg);color:var(--ink);box-shadow:var(--raise-s)}
.btn.line:active{box-shadow:var(--sink)}
.top .btn{background:var(--bg);color:var(--ink);box-shadow:var(--raise-s)}
.top .btn:active{box-shadow:var(--sink)}
.final .btn{background:var(--bg);color:var(--green);box-shadow:6px 6px 16px #00000040,-4px -4px 12px #FFFFFF26}
.final .btn:active{box-shadow:inset 4px 4px 10px #0000003d}

/* — FAQ : chaque question devient une carte en relief, creusée quand elle est ouverte — */
.faq details{border:0;background:var(--bg);border-radius:22px;padding:22px 28px;margin-bottom:18px;box-shadow:var(--raise-s)}
.faq details:last-child{border:0}
.faq details[open]{box-shadow:var(--sink)}

/* — déroulé et pied de page — */
.steps li{border-top-color:var(--line)}
.steps li:last-child{border-bottom-color:var(--line)}
footer{border-top:0}

/* ===== réglage : plus de verre, moins de relief ===== */
:root{
  --raise:4px 4px 10px color-mix(in srgb,var(--nm-lo) 45%,transparent),-4px -4px 10px color-mix(in srgb,var(--nm-hi) 70%,transparent);
  --raise-s:3px 3px 8px color-mix(in srgb,var(--nm-lo) 50%,transparent),-3px -3px 8px color-mix(in srgb,var(--nm-hi) 75%,transparent);
  --sink:inset 3px 3px 7px color-mix(in srgb,var(--nm-lo) 50%,transparent),inset -3px -3px 7px color-mix(in srgb,var(--nm-hi) 75%,transparent);
  --glass:#FFFFFF66; --glass-edge:#FFFFFFC7;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glass:#FFFFFF12;--glass-edge:#FFFFFF2B}}
:root[data-theme="dark"]{--glass:#FFFFFF12;--glass-edge:#FFFFFF2B}
/* fond plus coloré : le verre a davantage à flouter */
body{background:
  radial-gradient(34vw 34vw at 6% 5%,#2E7D5558,transparent 70%),
  radial-gradient(30vw 30vw at 92% 14%,#7BCB9F66,transparent 70%),
  radial-gradient(36vw 36vw at 78% 42%,#1F5C3F3D,transparent 70%),
  radial-gradient(32vw 32vw at 10% 58%,#7BCB9F55,transparent 70%),
  radial-gradient(36vw 36vw at 88% 82%,#2E7D554D,transparent 70%),
  radial-gradient(30vw 30vw at 20% 96%,#7BCB9F4D,transparent 70%),
  var(--bg);background-attachment:fixed}
/* les grandes surfaces passent en verre */
.cell,.offer:not(.main),.res-card,form,.faq details,.opt{
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid var(--glass-edge);box-shadow:0 14px 38px var(--glass-shadow),inset 0 1px 0 var(--glass-edge)}
.opt{box-shadow:0 8px 22px var(--glass-shadow),inset 0 1px 0 var(--glass-edge)}
.opt:hover{border-color:var(--glass-edge)}
.opt:active,.opt[aria-pressed="true"]{background:color-mix(in srgb,var(--green) 16%,var(--glass));border-color:color-mix(in srgb,var(--green) 55%,transparent);box-shadow:0 8px 22px var(--glass-shadow),inset 0 0 0 1px color-mix(in srgb,var(--green) 40%,transparent);color:var(--green)}
.opt .box{background:transparent}
.faq details[open]{box-shadow:0 14px 38px var(--glass-shadow),inset 0 0 0 1px color-mix(in srgb,var(--green) 35%,transparent)}
.shot,.steps .shot{box-shadow:0 18px 50px var(--glass-shadow);border:1px solid var(--glass-edge)}
.top{box-shadow:0 6px 24px var(--glass-shadow)}
/* le relief reste, discret, sur les petits éléments : champs, créneaux, boutons, jauges, carrés */
.slots span{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-edge);box-shadow:var(--raise-s)}
.slots input:checked+span{background:color-mix(in srgb,var(--green) 14%,var(--glass));border-color:color-mix(in srgb,var(--green) 50%,transparent);box-shadow:none}
.deco{box-shadow:0 10px 24px var(--glass-shadow)}
.d3{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-edge)}
.d4{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--green) 70%,transparent);background:var(--glass)}
